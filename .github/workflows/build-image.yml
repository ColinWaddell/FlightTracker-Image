name: Build Image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          # - arch: arm64
          #   runner: ubuntu-24.04-arm
          - arch: armhf
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup qemu-arm symlink for armhf cross-build
        if: matrix.arch == 'armhf'
        run: |
          # pi-gen-action installs qemu-user-static but only symlinks qemu-aarch64.
          # build-docker.sh needs qemu-arm in PATH on the host.
          sudo ln -sf /usr/bin/qemu-arm-static /usr/local/bin/qemu-arm
          
          # Register qemu-arm with F flag on host so it works inside containers
          sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
          echo ':qemu-arm-rpi:M::\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x28\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-arm-static:F' | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null 2>&1 || true
          
          # Verify
          cat /proc/sys/fs/binfmt_misc/qemu-arm-rpi 2>/dev/null || cat /proc/sys/fs/binfmt_misc/qemu-arm 2>/dev/null || echo "qemu-arm not registered"

      - name: Build ${{ matrix.arch }} image
        uses: usimd/pi-gen-action@v1.11.0
        id: build
        with:
          image-name: flighttracker-os-${{ matrix.arch }}
          stage-list: stage0 stage1 stage2 ./image/stage-flighttracker
          compression: xz
          pi-gen-release: ${{ matrix.arch == 'arm64' && 'arm64' || 'armhf' }}
          pi-gen-version: ${{ matrix.arch == 'arm64' && 'arm64' || 'master' }}
          release: trixie
          docker-opts: ${{ matrix.arch == 'armhf' && '--security-opt seccomp=unconfined' || '' }}
          locale: en_GB.UTF-8
          hostname: flighttracker
          keyboard-keymap: gb
          keyboard-layout: English (UK)
          timezone: Europe/London
          enable-ssh: 1
          enable-cloud-init: 0
          verbose-output: true

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: flighttracker-os-${{ matrix.arch }}
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 7