name: Build Image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          # - arch: arm64
          #   runner: ubuntu-24.04-arm
          - arch: armhf
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable binfmt_misc and install qemu for armhf cross-build
        if: matrix.arch == 'armhf'
        run: |
          # Install qemu-user-static which includes qemu-arm
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          
          # Mount binfmt_misc if not already mounted
          sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
          
          # Register qemu-arm for armhf binaries
          sudo update-binfmts --enable qemu-arm || true
          
          # Alternative: use docker's binfmt registration
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true
          
          # Verify registration
          cat /proc/sys/fs/binfmt_misc/qemu-arm 2>/dev/null || echo "qemu-arm not registered"

      - name: Build ${{ matrix.arch }} image
        uses: usimd/pi-gen-action@v1.11.0
        id: build
        with:
          image-name: flighttracker-os-${{ matrix.arch }}
          stage-list: stage0 stage1 stage2 ./image/stage-flighttracker
          compression: xz
          pi-gen-release: ${{ matrix.arch == 'arm64' && 'arm64' || 'armhf' }}
          pi-gen-version: ${{ matrix.arch == 'arm64' && 'arm64' || 'master' }}
          release: trixie
          locale: en_GB.UTF-8
          hostname: flighttracker
          keyboard-keymap: gb
          keyboard-layout: English (UK)
          timezone: Europe/London
          enable-ssh: 1
          enable-cloud-init: 0
          verbose-output: true

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: flighttracker-os-${{ matrix.arch }}
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 7