name: Build Image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: armhf
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.arch }} image
        uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: flighttracker-os-${{ matrix.arch }}
          stage-list: stage0 stage1 stage2 ./image/stage-flighttracker
          compression: xz
          pi-gen-release: ${{ matrix.arch == 'arm64' && 'arm64' || 'armhf' }}
          release: trixie
          locale: en_GB.UTF-8
          hostname: flighttracker
          keyboard-keymap: gb
          keyboard-layout: English (UK)
          timezone: Europe/London
          enable-ssh: 1
          enable-cloud-init: 0
          verbose-output: true

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: flighttracker-os-${{ matrix.arch }}
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 7