name: Build Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: armhf
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.arch }} image
        uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: flighttracker-os-${{ matrix.arch }}
          stage-list: stage0 stage1 stage2 ./image/stage-flighttracker
          compression: xz
          pi-gen-release: ${{ matrix.arch == 'arm64' && 'arm64' || 'armhf' }}
          extra-host-deps: qemu-user-static binfmt-support
          increase-runner-disk-size: true
          enable-pigen-cache: false
          pi-gen-config: |
            IMG_NAME=flighttracker-os-${{ matrix.arch }}
            RELEASE=bookworm
            LOCALE_DEFAULT=en_GB.UTF-8
            TARGET_HOSTNAME=flighttracker
            KEYBOARD_KEYMAP=gb
            KEYBOARD_LAYOUT="English (UK)"
            TIMEZONE_DEFAULT=Europe/London
            ENABLE_SSH=1
            ARCH=${{ matrix.arch }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: flighttracker-os-${{ matrix.arch }}
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 7
