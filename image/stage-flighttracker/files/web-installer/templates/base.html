<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FlightTracker Installer{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f8f9fa; }

    .ft-navbar {
      background: #fff;
      box-shadow: 0 1px 6px rgba(0,0,0,.1);
    }
    .ft-navbar .navbar-brand { font-weight: 600; }
    .ft-navbar .nav-link { font-size: .9rem; font-weight: 500; color: #495057; }
    .ft-navbar .nav-link.active { color: #0d6efd; font-weight: 600; }

    .card {
      border: none;
      box-shadow: 0 1px 6px rgba(0,0,0,.1);
    }

    .section-heading {
      font-size: 1.05rem;
      font-weight: 600;
      border-bottom: 1px solid #dee2e6;
      padding-bottom: .4rem;
      margin-bottom: 1rem;
    }

    /* Step indicator */
    .ft-steps {
      display: flex;
      gap: 0;
      margin-bottom: 1.75rem;
    }
    .ft-step {
      flex: 1;
      display: flex;
      align-items: center;
      font-size: 0.8rem;
      color: #6c757d;
    }
    .ft-step::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #dee2e6;
      margin: 0 0.5rem;
    }
    .ft-step:last-child::after { display: none; }
    .ft-step-dot {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #dee2e6;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700;
      flex-shrink: 0;
      margin-right: 0.4rem;
      color: #6c757d;
    }
    .ft-step.active .ft-step-dot {
      background: #0d6efd;
      border-color: #0d6efd;
      color: #fff;
    }
    .ft-step.done .ft-step-dot {
      background: #198754;
      border-color: #198754;
      color: #fff;
    }

    /* Terminal / log output */
    .ft-terminal {
      background: #212529;
      border-radius: .375rem;
      padding: 1rem;
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      color: #adb5bd;
      min-height: 320px;
      max-height: 480px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
    }

    /* Spinner for reboot page */
    .spinner-ring {
      width: 56px; height: 56px;
      border: 5px solid #dee2e6;
      border-top-color: #0d6efd;
      border-radius: 50%;
      animation: ft-spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes ft-spin { to { transform: rotate(360deg); } }

    /* Pixel-art logo */
    .ft-logo-img {
      height: 28px;
      width: auto;
      image-rendering: pixelated;
    }
  </style>
  {% block head %}{% endblock %}
</head>
